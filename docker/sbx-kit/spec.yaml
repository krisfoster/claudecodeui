schemaVersion: "1"
kind: mixin
name: claudecodeui-dev
displayName: CloudCLI (claudecodeui) dev server
description: >-
  Installs the native build toolchain and launches this repo's CloudCLI
  dev server from source (API on :3001, Vite client on :5173) inside the
  sandbox. Rebuilds native modules (better-sqlite3, node-pty, bcrypt) for
  the sandbox's platform, since the workspace bind mount can otherwise
  carry over host-built binaries that fail to load on Linux.

environment:
  variables:
    # Seeds the sandbox's one user with skipPermissions: true at first-run
    # registration, so Claude sessions started through the web UI don't ask
    # for tool approval on every step — matching the sandbox's own
    # interactive claude agent, which already runs with
    # --dangerously-skip-permissions. Only affects account creation; existing
    # accounts and their settings are never touched.
    CLOUDCLI_DEFAULT_CLAUDE_SKIP_PERMISSIONS: "true"
    # Auto-creates the sandbox's one user (username "admin") with a randomly
    # generated password at boot, instead of requiring a human to open the
    # web UI and complete the setup form before anyone can sign in. The
    # server prints the generated password to stdout once, which
    # `ccui-sbx` surfaces in its startup summary. Only fires when no user
    # exists yet — never touches an existing account.
    CLOUDCLI_AUTO_CREATE_ADMIN: "true"
    # `sbx` always bind-mounts a workspace at its exact host absolute path
    # (e.g. /Users/<you>/repos/claudecodeui), never remapped under
    # /home/agent — there is no `sbx` flag to change that, for the primary
    # workspace or any extra one. The app's own default WORKSPACES_ROOT
    # (os.homedir(), i.e. /home/agent here) would reject every one of
    # those paths when adding a project. FORBIDDEN_WORKSPACE_PATHS
    # (server/shared/utils.ts) still blocks /etc, /bin, /usr, /var, /root,
    # bare /, etc. regardless of this value — the sandbox's own mount
    # boundary (only what you explicitly mounted exists in here at all) is
    # the real security boundary for a disposable single-user dev sandbox,
    # so the extra home-directory-shaped restriction is redundant here.
    WORKSPACES_ROOT: "/"

commands:
  install:
    - command: "apt-get update -qq && apt-get install -y --no-install-recommends build-essential python3 python3-setuptools >/dev/null && rm -rf /var/lib/apt/lists/*"
      user: "root"
      description: "Install native build toolchain for better-sqlite3 / node-pty / bcrypt"

  initFiles:
    - path: /home/agent/.claudecodeui-start.sh
      mode: "0755"
      content: |
        #!/bin/sh
        set -e
        # commands.startup runs with a minimal PATH that drops the image's
        # own additions (/home/agent/.local/bin, where the `claude` binary
        # lives) — without this the dev server's Node process can't find
        # `claude` and every session fails with "Claude Code native binary
        # not found at claude". CLAUDE_CLI_PATH is a belt-and-suspenders
        # explicit override for the same lookup.
        export PATH="/home/agent/.local/bin:/usr/local/share/npm-global/bin:$PATH"
        export CLAUDE_CLI_PATH="/home/agent/.local/bin/claude"
        cd "${WORKDIR}"
        echo "[claudecodeui] npm install..."
        npm install >/tmp/claudecodeui-install.log 2>&1
        echo "[claudecodeui] rebuilding native modules for this sandbox..."
        npm rebuild better-sqlite3 node-pty bcrypt >>/tmp/claudecodeui-install.log 2>&1
        echo "[claudecodeui] starting dev server (server :3001, vite :5173)..."
        nohup npm run dev >/tmp/claudecodeui-dev.log 2>&1 &

    - path: /home/agent/.claude-link-skills.sh
      mode: "0755"
      content: |
        #!/bin/sh
        # ccui-sbx's CCUI_SBX_SKILLS_PLUGINS mounts one or more host Claude
        # plugin directories read-only and passes their (unchanged, since a
        # mount always lands at its exact host path) locations here via
        # CLOUDCLI_EXTRA_SKILLS_DIRS, colon-joined. This is a flat skill
        # copy, not a real plugin install: every subfolder under each
        # plugin's skills/ gets symlinked into ~/.claude/skills/ — the same
        # mechanism `sbx run --skills` uses for a personal skills directory
        # — but the plugin's own namespace prefix and any hooks.json it
        # defines are not replicated.
        set -e
        mkdir -p "$HOME/.claude/skills"
        old_ifs="$IFS"
        IFS=:
        for plugin_dir in ${CLOUDCLI_EXTRA_SKILLS_DIRS:-}; do
          IFS="$old_ifs"
          [ -n "$plugin_dir" ] || continue
          if [ ! -d "$plugin_dir/skills" ]; then
            echo "[claudecodeui] no skills/ dir in mounted plugin, skipping: $plugin_dir"
            IFS=:
            continue
          fi
          for skill_dir in "$plugin_dir"/skills/*/; do
            [ -d "$skill_dir" ] || continue
            skill_name="$(basename "${skill_dir%/}")"
            ln -sfn "${skill_dir%/}" "$HOME/.claude/skills/$skill_name"
            echo "[claudecodeui] linked skill: $skill_name -> ${skill_dir%/}"
          done
          IFS=:
        done
        IFS="$old_ifs"

    - path: /home/agent/.claude-mkdir-host-sessions.sh
      mode: "0755"
      content: |
        #!/bin/sh
        # Ensures the real ~/.claude/projects parent exists as the agent
        # user, before the root-run mount step (which needs CAP_SYS_ADMIN)
        # creates any per-project subfolders under it — otherwise a fresh
        # sandbox's first such subfolder would be created by root, and the
        # agent's own native `claude` CLI needs to create sibling project
        # folders there later.
        set -e
        if [ -n "${CLOUDCLI_HOST_SESSIONS_DIR:-}" ]; then
          mkdir -p "$HOME/.claude/projects"
        fi

    - path: /home/agent/.claude-mount-host-sessions.sh
      mode: "0755"
      content: |
        #!/bin/sh
        # ccui-sbx's CCUI_SBX_IMPORT_HOST_SESSIONS mounts the host's real
        # Claude Code session history (default ~/.claude/projects, or
        # CCUI_SBX_HOST_SESSIONS_DIR) and passes its mounted location here
        # via CLOUDCLI_HOST_SESSIONS_DIR (unchanged, since a mount always
        # lands at its exact host path).
        #
        # Each session is bind-mounted INDIVIDUALLY, at its own natural
        # ~/.claude/projects/<folder-name>/<session-id>.jsonl — not a
        # symlink, and not nested under a wrapper directory. Two things
        # forced this, both found by testing the actual behavior rather
        # than assuming it:
        #
        # 1. A symlink is invisible to claudecodeui's own session-discovery
        #    code: findFilesRecursivelyCreatedAfter (server/shared/utils.ts)
        #    and the chokidar watcher (sessions-watcher.service.ts, which
        #    sets followSymlinks: false) both use readdir()'s
        #    Dirent.isDirectory(), false for a symlink entry. A bind mount
        #    is a genuine directory/file entry, so both already handle it
        #    correctly with no app code changes.
        #
        # 2. Nesting everything under one `.imported-host-sessions` wrapper
        #    (tried first, to dodge a folder-name collision with the
        #    sandbox's own native session folders) breaks RESUMING any
        #    imported session: the real `claude` CLI's own `--resume
        #    <session-id>` does its own internal lookup from `cwd`, using
        #    the exact same folder-name encoding, and has no idea the
        #    wrapper exists — it looks at the natural, non-nested path and
        #    reports "No conversation found". Confirmed directly: copying
        #    a nested session's .jsonl to its natural path made `--resume`
        #    work immediately; left nested, it failed with that exact
        #    message every time. claudecodeui's own sync could already
        #    find and list the nested file fine — only the native CLI's
        #    resume lookup needed the natural path, which is why this
        #    surfaced as "browsing history works, continuing a chat
        #    doesn't" rather than an import-time error.
        #
        # Per-session-file mounting also resolves the collision concern
        # that nesting was trying to solve in the first place, without the
        # wrapper: a session id is a UUID, so a host-imported file and a
        # pre-existing native file can only ever collide by naming the
        # exact same session — astronomically unlikely — rather than by
        # sharing a project folder, which is the collision nesting was
        # guarding against. Any sibling file already in that project
        # folder (native or otherwise) is simply untouched.
        #
        # A session's subagent/tool-result artifacts (created under a
        # directory named after its own session id, sitting next to the
        # .jsonl — e.g. <folder>/<session-id>/subagents/...) are mounted
        # too when present, so a resumed session that used subagents or
        # workflows still has them.
        #
        # CLOUDCLI_HOST_SESSIONS_MOUNTED_ONLY=1 scopes this to only
        # sessions whose own cwd is this sandbox's primary checkout or an
        # extra mounted workspace (CLOUDCLI_MOUNTED_WORKSPACE_PATHS,
        # colon-joined) — now checked per SESSION rather than per folder,
        # which is strictly more precise than the original per-folder
        # approximation (a folder with sessions from two different cwds no
        # longer has to choose one for the whole folder). cwd is sampled
        # directly from each session's own .jsonl content (the same
        # ground truth the app's own synchronizer trusts) rather than
        # re-deriving Claude's folder-name encoding, which collapses "/",
        # ".", and "_" all to "-" and is lossy to reverse. Matching is
        # "equal to or a descendant of" a mounted workspace, via a literal
        # (non-glob) prefix strip — `${var#"$pattern"}` treats a quoted
        # pattern as a literal string in POSIX sh/dash, confirmed
        # empirically, so a workspace or cwd path containing glob-special
        # characters (`*`, `?`, `[`) can't cause a false match.
        # CLOUDCLI_MOUNTED_WORKSPACE_PATHS entries are resolved with
        # `pwd -P` (ccui-sbx), not a logical `pwd`, since a session's
        # recorded cwd is the kernel's physical getcwd() with symlinks
        # already resolved — a logical path would silently never match
        # its own history whenever a mounted workspace has a symlinked
        # ancestor (e.g. macOS's /tmp -> /private/tmp).
        #
        # Each mount is checked with `mountpoint -q` first (idempotent
        # across restarts — a container restart resets the mount
        # namespace, so this legitimately needs to redo every mount then)
        # and guarded so one failure doesn't abort the whole scan: under
        # `set -e`, dash (confirmed empirically) aborts an entire script
        # on any failing command inside a for loop, not just that
        # iteration.
        set -e

        path_matches_workspace() {
          cwd_arg="$1"
          workspace_arg="$2"
          if [ "$workspace_arg" = "/" ] || [ "$cwd_arg" = "$workspace_arg" ]; then
            return 0
          fi
          stripped="${cwd_arg#"$workspace_arg"/}"
          [ "$stripped" != "$cwd_arg" ]
        }

        # True (0) when this session should be mounted: always, unless
        # CLOUDCLI_HOST_SESSIONS_MOUNTED_ONLY is set, in which case only
        # when this session's own cwd is under a mounted workspace.
        session_matches_filter() {
          jsonl="$1"
          if [ -z "${CLOUDCLI_HOST_SESSIONS_MOUNTED_ONLY:-}" ]; then
            return 0
          fi

          cwd="$(grep -o -m1 '"cwd":"[^"]*"' "$jsonl" | head -n1)"
          cwd="${cwd#\"cwd\":\"}"
          cwd="${cwd%\"}"
          [ -n "$cwd" ] || return 1
          cwd="${cwd%/}"
          [ -n "$cwd" ] || cwd="/"

          old_ifs="$IFS"
          IFS=:
          for workspace in $CLOUDCLI_MOUNTED_WORKSPACE_PATHS; do
            IFS="$old_ifs"
            [ -n "$workspace" ] || continue
            workspace="${workspace%/}"
            [ -n "$workspace" ] || workspace="/"
            if path_matches_workspace "$cwd" "$workspace"; then
              IFS=:
              return 0
            fi
            IFS=:
          done
          IFS="$old_ifs"
          return 1
        }

        # Bind-mounts $1 onto $2, creating $2 first (a directory or an
        # empty file, matching $1's type — a file bind mount needs an
        # existing file as its target). Idempotent; logs and returns
        # non-zero on failure rather than aborting the caller's loop.
        bind_mount_once() {
          src="$1"
          target="$2"
          if mountpoint -q "$target" 2>/dev/null; then
            return 0
          fi
          if [ -d "$src" ]; then
            mkdir -p "$target"
          else
            mkdir -p "$(dirname "$target")"
            touch "$target"
          fi
          if mount --bind "$src" "$target" 2>/dev/null; then
            return 0
          fi
          echo "[claudecodeui] warning: failed to bind-mount $src -> $target, skipping" >&2
          return 1
        }

        if [ -n "${CLOUDCLI_HOST_SESSIONS_DIR:-}" ]; then
          for project_dir in "$CLOUDCLI_HOST_SESSIONS_DIR"/*/; do
            [ -d "$project_dir" ] || continue
            project_dir="${project_dir%/}"
            folder_name="$(basename "$project_dir")"
            # Not $HOME: this step runs as root, whose $HOME is /root, not
            # /home/agent.
            natural_folder="/home/agent/.claude/projects/$folder_name"

            for jsonl in "$project_dir"/*.jsonl; do
              [ -f "$jsonl" ] || continue
              session_matches_filter "$jsonl" || continue

              session_id="$(basename "$jsonl" .jsonl)"
              mkdir -p "$natural_folder"
              bind_mount_once "$jsonl" "$natural_folder/$session_id.jsonl" || continue

              artifacts_dir="$project_dir/$session_id"
              if [ -d "$artifacts_dir" ]; then
                bind_mount_once "$artifacts_dir" "$natural_folder/$session_id"
              fi
            done
          done
        fi

  startup:
    - command: ["sh", "/home/agent/.claude-link-skills.sh"]
      user: "1000"
      description: "Symlink any mounted plugin skill directories into ~/.claude/skills"

    - command: ["sh", "/home/agent/.claude-mkdir-host-sessions.sh"]
      user: "1000"
      description: "Create the host-sessions bind-mount target, agent-owned"

    - command: ["sh", "/home/agent/.claude-mount-host-sessions.sh"]
      user: "root"
      background: true
      description: "Bind-mount the host Claude Code sessions dir into ~/.claude/projects"

    - command: ["sh", "/home/agent/.claudecodeui-start.sh"]
      user: "1000"
      background: true
      description: "Install deps, rebuild native modules, and start the dev server"

agentContext: |
  This kit installs and starts the claudecodeui (CloudCLI) dev server from
  the mounted workspace source. Logs: /tmp/claudecodeui-install.log and
  /tmp/claudecodeui-dev.log. Server API listens on :3001, Vite client on
  :5173. Publish ports from the host with:
    sbx ports <sandbox-name> --publish 3001:3001 --publish 5173:5173
